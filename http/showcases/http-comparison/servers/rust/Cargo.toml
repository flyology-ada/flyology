[package]
name = "flyology-http-comparison-rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
actix-web = { version = "=4.14.0", default-features = false, features = ["macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "=1.12.1"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["server", "tokio"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
