name: Agent resources

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install APM
        run: pip install apm-cli==0.28.0
      - name: Reproduce agent resources
        run: |
          apm install --frozen
          apm compile --target codex
          apm audit --ci
          git diff --exit-code -- AGENTS.md flyology_allocators/AGENTS.md flyology_allocators/benchmarks/AGENTS.md website/AGENTS.md apm.lock.yaml
