name = "flyology"
description = "Event-loop processes for the GNAT Ada runtime"
version = "0.1.0-dev"

authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = ""
tags = ["ada", "runtime", "event-loop", "concurrency"]
project-files = ["flyology.gpr"]

[[depends-on]]
gnat = ">=13 & <17"

[available.'case(os)']
'linux|macos' = true
'...' = false

[environment]
FLYOLOGY_ROOT.set = "${CRATE_ROOT}"

[[actions]]
type = "test"
command = ["./scripts/test.sh"]
